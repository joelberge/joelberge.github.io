  switch_label: Norsk
  switch_short: "NO"
  meta_description: >-
    Joel W. Berge is Associate Professor of Business Economics at NHH Norwegian School of Economics. He studies
    ethics and profitability, speaks on AI, trust and ethics, and co-hosts the podcast Lederskap.
  nav:
    about: About
    talks: Talks
    research: Research
    media: Media
    podcast: Podcast
    cv: CV
    contact: Contact
  intro: >-
    My research sits where <mark>ethics and profitability</mark> meet. Using experiments, I study how people
    and organisations handle ethical trade-offs, and how values, social norms and regulation shape their decisions.
  intro_2: >-
    I also give talks and workshops for businesses, and co-host Lederskap, NHH's podcast on leadership.
