- title: KI-kompasset
  authors: Berge, J. W.
  venue: Magma
  year: forthcoming
  status: forthcoming
  featured: true
  viz: compass
  summary:
    nb: >-
      Et rammeverk for ledere som skal avgjøre hvilken rolle KI skal ha i en beslutningsprosess.
      To spørsmål, om målklarhet og separerbarhet, gir fire kvadranter: forsterket skjønn, automatiserte
      beslutninger, utforskende støtte og strategisk autonomi. Hver kvadrant har sin egen fallgruve.
    en: >-
      A framework for leaders deciding what role AI should play in a decision process. Two questions,
      about goal clarity and separability, give four quadrants: augmented judgment, automated decision-making,
      exploratory support and strategic autonomy. Each quadrant has its own pitfall.

- title: "Mixed Motives for Doing Good: The Effect of Profit Motives in CSR Initiatives on Employee Opportunism"
  authors: Arshad, F. M., & Berge, J. W.
  venue: Behavioral Research in Accounting
  year: 2026
  status: article
  featured: true
  image: /assets/img/research/mixed-motives.svg
  summary:
    nb: >-
      Bedrifter driver ofte samfunnsansvar både for å gjøre godt og for å tjene penger. I et eksperiment
      undersøker vi om slike blandede motiver påvirker hvor opportunistisk ansatte oppfører seg.
    en: >-
      Firms often pursue social responsibility both to do good and to make money. In an experiment,
      we test whether such mixed motives change how opportunistically employees behave.

