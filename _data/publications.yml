- title: "Observable Information Acquisition, Social Costs, and Pay Dispersion"
  authors: Berge, J. W., Traini, S., & Vattø, T.
  status: working
  featured: true
  image: /assets/img/research/pay-dispersion.svg
  link: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6747599
  press:
    - title: Denne setningen kan ha gitt deg lavere lønn
      outlet: digi.no
      link: https://www.digi.no/artikler/denne-setningen-kan-ha-gitt-deg-lavere-lonn/533334?key=9cRb3WGp
  note:
    nb: Revise and resubmit, Journal of Accounting Research
    en: Revise and resubmit, Journal of Accounting Research
  summary:
    nb: >-
      Da Norge gjorde søk i skattelistene synlige for den som blir søkt på, ble det sosialt kostbart å hente
      lønnsinformasjon om andre. Lønnsforskjellene økte mer, om lag 3–4 prosent, i bedrifter med færre søk etter
      reformen. Hvor godt åpenhet virker, avhenger altså ikke bare av om informasjonen finnes, men av hva det
      koster å hente den.
    en: >-
      When Norway made searches in public tax records visible to the person searched, looking up others' pay
      became socially costly. Pay dispersion rose more, by about 3–4 percent, in firms with fewer searches after
      the reform. How well transparency works depends not only on whether information is available, but on the
      cost of acquiring it.

- title: "KI-kompasset: Et strategisk verktøy for å navigere KI-implementering"
  authors: Berge, J. W., & Knudsen, D.-R.
  venue: Magma, 4/2026, 57–64
  year: forthcoming
  status: forthcoming
  featured: true
  press:
    - title: AI-kappløpet – sprint eller orienteringsløp?
      outlet: Finansavisen
      link: https://www.finansavisen.no/teknologi/2026/03/05/8332434/ai-kapplopet-sprint-eller-orienteringslop-
  viz: compass
  # Photo alternative: image: /assets/img/research/ki-kompasset.webp
  summary:
    nb: >-
      Når KI bygges inn i beslutningssystemer, kan den forsterke gode valg, men også skalere konsekvensene av
      dårlige. KI-kompasset definerer fire idealtypiske roller for KI i ulike beslutningsprosesser. Ledere må
      først diagnostisere beslutningstypen, og deretter velge hvilken rolle KI skal ha.
    en: >-
      When AI is built into decision systems, it can strengthen good choices, but also scale the consequences
      of bad ones. The AI Compass defines four ideal-typical roles for AI in different decision processes.
      Leaders must first diagnose the type of decision, and then choose the role AI should play.

- title: "Mixed Motives for Doing Good: The Effect of Profit Motives in CSR Initiatives on Employee Opportunism"
  authors: Arshad, F. M., & Berge, J. W.
  venue: Behavioral Research in Accounting
  year: 2026
  status: article
  featured: true
  image: /assets/img/research/mixed-motives.svg
  summary:
    nb: >-
      Bedrifter driver ofte samfunnsansvar både for å gjøre godt og for å tjene penger. I et eksperiment
      undersøker vi om slike blandede motiver påvirker hvor opportunistisk ansatte oppfører seg.
    en: >-
      Firms often pursue social responsibility both to do good and to make money. In an experiment,
      we test whether such mixed motives change how opportunistically employees behave.

