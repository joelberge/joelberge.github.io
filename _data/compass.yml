# KI-kompasset / The AI Compass: the interactive tool at /ki-kompasset/ and /en/ai-compass/.
# Based on Berge & Knudsen (2026), "KI-kompasset", Magma 29(4), 57–64. https://doi.org/10.23865/magma.v29.1575
#
# How the scoring works (the logic itself is in assets/js/compass.js):
#   g  goal clarity, from the questions marked axis: goal. Each option has a score from -2 to +2.
#      The sum is scaled to -1..+1. Positive = high goal clarity (top half of the compass).
#   s  separability = the LOWEST of three sources, because any one of them is enough to keep a human in:
#      technical (axis: tech, scaled to -1..+1), legitimacy (axis: legit, -1..+1) and regulatory (axis: law).
#      Positive = high separability (right half).
#   Quadrants: I high g / low s, II high g / high s, III low g / low s, IV low g / high s.
#   Within 0.2 of an axis counts as borderline.
# Option ids (like "approve" or "habit") are used by the findings in compass.js. Change the wording freely,
# but keep the ids and scores unless you also change the logic.

