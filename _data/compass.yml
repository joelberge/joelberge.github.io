# Words that suggest the user typed a whole strategy instead of one decision.
too_broad_words: [strategi, strategy, implementering, implementation, hele, alle, generelt, general, everything, overall, organisasjon, organisation, organization, digitalisering]

quadrants:
  I:
    name: { nb: Forsterket skjønn, en: Augmented judgment }
    role:
      nb: KI skal styrke skjønnet ved å flagge avvik, foreslå risikoområder og utfordre antakelser. Et menneske vurderer og står ansvarlig.
      en: AI should strengthen judgment by flagging anomalies, suggesting risk areas and challenging assumptions. A person assesses and is accountable.
  II:
    name: { nb: Automatisert beslutning, en: Automated decision-making }
    role:
      nb: KI kan ta beslutningen. Mennesker håndterer unntak og klager.
      en: AI can make the decision. People handle exceptions and appeals.
  III:
    name: { nb: Utforskende støtte, en: Exploratory support }
    role:
      nb: KI skal gi innsikt, mønstre og alternativer. Beslutningstakeren vurderer og bestemmer.
      en: AI should provide insight, patterns and alternatives. The decision maker assesses and decides.
  IV:
    name: { nb: Strategisk autonomi, en: Strategic autonomy }
    role:
      nb: KI kan handle selvstendig, men bare innenfor mål som ledelsen har definert og skrevet ned.
      en: AI can act on its own, but only within goals that management has defined and written down.

questions:
  # ---------- Step 1: the decision (the two axes) ----------
  - id: outcome
    step: decision
    axis: goal
    text:
      nb: Hvor lett er det å si hva som er et godt utfall av denne beslutningen?
      en: How easy is it to say what a good outcome of this decision is?
    hint:
      nb: >-
        En redaktør som vil selge flest mulig aviser, har et enkelt mål. En redaktør som vil bygge redaksjonen
        som en seriøs og relevant samfunnsaktør, må veie relevans mot omdømme. Det målet er sammensatt.
      en: >-
        An editor who wants to sell as many papers as possible has a simple goal. An editor who wants to build
        the newsroom into a serious and relevant voice in society must weigh relevance against reputation. That goal is composite.
    options:
      - { id: simple, score: 2, text: { nb: "Lett, det er ett mål, og det står fast", en: "Easy, there is one goal, and it stays the same" } }
      - { id: settled, score: 0, text: { nb: "Det er noen få hensyn, men de er stort sett avklart", en: "There are a few considerations, but they are mostly settled" } }
      - { id: composite, score: -2, text: { nb: "Vanskelig, målet er sammensatt, og det som teller, endrer seg over tid", en: "Hard, the goal is composite, and what counts changes over time" } }

  - id: number
    step: decision
    axis: goal
    text:
      nb: Kan dere måle om beslutningen ble god, med ett tall?
      en: Can you tell whether the decision was good from a single number?
    options:
      - { id: "yes", score: 2, text: { nb: "Ja, ett tall fanger det", en: "Yes, one number captures it" } }
      - { id: partly, score: -1, text: { nb: "Delvis, tallet fanger ikke alt som betyr noe", en: "Partly, the number misses some of what matters" } }
      - { id: "no", score: -2, text: { nb: "Nei, det avgjøres av skjønn og over tid", en: "No, it takes judgment and time to tell" } }

  - id: perfect
    step: decision
    axis: goal
    text:
      nb: Tenk deg at systemet treffer målet perfekt. Kan beslutningen likevel skade tilliten til dere eller omdømmet deres?
      en: Imagine the system hits its target perfectly. Could the decision still damage trust in you or your reputation?
    hint:
      nb: >-
        Ubers prisalgoritme satte opp prisen når etterspørselen var høy, og traff betalingsviljen presist.
        Likevel opplevde kundene det som utnyttelse, og omdømmet tok skade. Målet var bredere enn tallet algoritmen optimerte.
      en: >-
        Uber's pricing algorithm raised prices when demand was high and predicted willingness to pay precisely.
        Customers still felt exploited, and the reputation suffered. The goal was broader than the number the algorithm optimised.
    options:
      - { id: "no", score: 2, text: { nb: Nei, en: "No" } }
      - { id: maybe, score: -1, text: { nb: "Kanskje, i enkelte tilfeller", en: "Possibly, in some cases" } }
      - { id: "yes", score: -2, text: { nb: "Ja, det er en reell risiko", en: "Yes, that is a real risk" } }

  - id: data
    step: decision
    axis: tech
    text:
      nb: Hvor mye av det som trengs for å ta beslutningen, finnes i data dere har?
      en: How much of what the decision needs is in data you already have?
    options:
      - { id: most, score: 2, text: { nb: Nesten alt, en: Almost all of it } }
      - { id: much, score: -1, text: { nb: "Mye, men noe avgjørende står ingen steder: samtaler, inntrykk, kontekst", en: "Much, but something crucial is not written down: conversations, impressions, context" } }
      - { id: little, score: -2, text: { nb: "Lite, det handler mest om å forstå situasjonen", en: "Little, it is mostly about reading the situation" } }

  - id: error
    step: decision
    axis: tech
    text:
      nb: Hva skjer hvis en feil slipper gjennom?
      en: What happens if a mistake slips through?
    options:
      - { id: cheap, score: 2, text: { nb: Den oppdages og rettes raskt og billig, en: It is caught and fixed quickly and cheaply } }
      - { id: contained, score: 0, text: { nb: "Den koster, men skaden er avgrenset", en: "It costs, but the damage is contained" } }
      - { id: spreads, score: -2, text: { nb: Den kan spre seg eller ikke gjøres om, en: It can spread or cannot be undone } }

  - id: accountable
    step: decision
    axis: legit
    text:
      nb: Ville et godt resultat miste verdi hvis de som berøres, fikk vite at ingen person sto ansvarlig for vurderingen?
      en: Would a good result lose value if the people affected learned that no person was accountable for the assessment?
    options:
      - { id: "no", score: 1, text: { nb: "Nei, de bryr seg bare om resultatet", en: "No, they only care about the result" } }
      - { id: some, score: -0.5, text: { nb: Noen ville reagert, en: Some would object } }
      - { id: "yes", score: -1, text: { nb: "Ja, de betaler nettopp for at noen står inne for det", en: "Yes, they pay precisely for someone standing behind it" } }

  - id: people
    step: decision
    text:
      nb: Får beslutningen rettslige eller vesentlige konsekvenser for enkeltpersoner, for eksempel for lån, jobb, forsikring eller offentlige ytelser?
      en: Does the decision have legal or significant effects on individuals, for example on loans, jobs, insurance or public benefits?
    options:
      - { id: "no", text: { nb: Nei, en: "No" } }
      - { id: "yes", text: { nb: Ja, en: "Yes" } }

  - id: law
    step: decision
    axis: law
    text:
      nb: Krever lov, tilsyn eller bransjeregler at et menneske tar eller godkjenner beslutningen?
      en: Do laws, regulators or industry rules require a person to make or approve the decision?
    options:
      - { id: "no", score: 1, text: { nb: Nei, en: "No" } }
      - { id: unsure, score: 0, text: { nb: Usikker, en: Not sure } }
      - { id: "yes", score: -1, text: { nb: Ja, en: "Yes" } }

  # ---------- Step 2: the strategy ----------
  - id: value
    step: strategy
    text:
      nb: Hva er det kundene egentlig verdsetter ved denne beslutningen?
      en: What do customers really value about this decision?
    hint_label: { nb: Hva menes med dette?, en: What does this mean? }
    hint:
      nb: >-
        Tenk på hva kunden ville savnet hvis beslutningen ble tatt på en annen måte. Bulder Bank-kunder verdsetter at banken
        holder løftet om lavere rente uten at de selv må følge med, og det kan automatiseres. En revisjonskunde verdsetter at
        en revisor står inne for regnskapet, og det kan ikke. Er beslutningen intern, tenk på dem som berøres av den.
      en: >-
        Think about what customers would miss if the decision were made differently. Bulder Bank's customers value that the bank
        keeps its promise of a lower rate without them having to keep watch, and that can be automated. An audit client values
        that an auditor stands behind the accounts, and that cannot. If the decision is internal, think of the people it affects.
    options:
      - { id: cheap, text: { nb: At den er rask og billig, en: That it is fast and cheap } }
      - { id: outcome, text: { nb: "At den treffer best mulig, uansett hvem som tar den", en: "That it is as accurate as possible, whoever makes it" } }
      - { id: judgment, text: { nb: At noen med kompetanse står inne for den, en: That someone competent stands behind it } }

  - id: compete
    step: strategy
    text:
      nb: Hva konkurrerer dere på?
      en: What do you compete on?
    options:
      - { id: cost, text: { nb: "Kostnad, skala og fart", en: "Cost, scale and speed" } }
      - { id: judgment, text: { nb: Kvalitet i vurderingene og tillit, en: Quality of judgment and trust } }
      - { id: both, text: { nb: Begge deler, en: Both } }

  - id: core
    step: strategy
    text:
      nb: Er denne beslutningen en del av grunnen til at kundene velger dere?
      en: Is this decision part of the reason customers choose you?
    options:
      - { id: core, text: { nb: "Ja, den er en del av kjernen", en: "Yes, it is part of the core" } }
      - { id: support, text: { nb: "Nei, den er en støtteprosess", en: "No, it is a support process" } }

  # ---------- Step 3: the implementation ----------
  - id: now
    step: implementation
    text:
      nb: Hvilken rolle har KI i denne beslutningen, i dag eller i planene deres?
      en: What role does AI play in this decision, today or in your plans?
    options:
      - { id: none, level: 0, text: { nb: Ingen, en: None } }
      - { id: advise, level: 1, text: { nb: "KI gir innsikt og forslag, et menneske bestemmer", en: "AI gives insight and suggestions, a person decides" } }
      - { id: approve, level: 2, text: { nb: "KI bestemmer, et menneske godkjenner", en: "AI decides, a person approves" } }
      - { id: alone, level: 3, text: { nb: KI bestemmer alene, en: AI decides on its own } }

  - id: override
    step: implementation
    show_if: { now: [approve] }
    text:
      nb: Har den som godkjenner, tid, kompetanse og informasjon til å overprøve KI, nå eller i systemet dere planlegger?
      en: Does the person approving have the time, expertise and information to overrule the AI, now or in the system you are planning?
    hint:
      nb: >-
        Kommer det hundre forslag om dagen og hver godkjenning tar sekunder, blir godkjenningen i praksis et stempel.
        Det samme skjer når den som godkjenner, ikke ser grunnlaget KI bygger på.
      en: >-
        If a hundred suggestions arrive each day and each approval takes seconds, approval becomes a rubber stamp in practice.
        The same happens when the approver cannot see what the AI based its suggestion on.
    options:
      - { id: rarely, text: { nb: "Nei, i praksis blir det å godta det KI foreslår", en: "No, in practice it means accepting what the AI suggests" } }
      - { id: sometimes, text: { nb: Delvis, en: Partly } }
      - { id: often, text: { nb: "Ja, og det forventes at de overprøver når det trengs", en: "Yes, and they are expected to overrule when needed" } }

  - id: why
    step: implementation
    show_if: { now: [none, advise, approve] }
    text:
      nb: Hva er hovedgrunnen til at et menneske fortsatt er med i beslutningen?
      en: What is the main reason a person is still part of the decision?
    options:
      - { id: tech, text: { nb: KI er ikke god nok ennå, en: AI is not good enough yet } }
      - { id: legit, text: { nb: Noen må stå ansvarlig, en: Someone has to be accountable } }
      - { id: law, text: { nb: Loven krever det, en: The law requires it } }
      - { id: habit, text: { nb: "Vane, det har alltid vært slik", en: "Habit, it has always been done this way" } }

  - id: goals
    step: implementation
    show_if: { now: [advise, approve, alone] }
    text:
      nb: Har ledelsen skrevet ned hva KI skal optimere mot, og hva den ikke skal ofre?
      en: Has management written down what the AI should optimise for, and what it must not sacrifice?
    options:
      - { id: explicit, text: { nb: "Ja, eksplisitt", en: "Yes, explicitly" } }
      - { id: implicit, text: { nb: Delvis eller underforstått, en: Partly or implicitly } }
      - { id: none, text: { nb: Nei, en: "No" } }

# Long-term challenge, shown as its own section when separability is high (quadrant II or IV).
# From Joel's op-ed "Vil jakten på AI-effektivitet tømme selskapene for dømmekraft?" (Finansavisen, 2026).
long_term:
  label: { nb: På lang sikt, en: In the long run }
  title:
    nb: Hvem skal kontrollere KI om ti år?
    en: Who will check the AI in ten years?
  body:
    nb: >-
      Når KI tar beslutningene, trenger dere fortsatt folk som ser når den tar feil, og som håndterer unntakene.
      Den dømmekraften bygges ved å gjøre arbeidet selv, med friksjon og feil. Fjerner dere friksjonen for juniorene,
      tærer dere på et lager av dømmekraft uten å fylle på.
    en: >-
      When AI makes the decisions, you still need people who can see when it is wrong and who handle the exceptions.
      That judgment is built by doing the work yourself, with friction and mistakes. Remove the friction for juniors,
      and you draw down a stock of judgment without refilling it.
  advice:
    nb: >-
      Gi juniorer et KI-system som gir hint og motargumenter i stedet for svar, og mål om de utvikler selvstendig
      problemløsning, ikke bare hvor raskt de leverer. Det koster effektivitet i dag, men er en investering i morgendagens seniorer.
    en: >-
      Give juniors an AI system that offers hints and counter-arguments instead of answers, and measure whether they
      develop independent problem-solving, not just how fast they deliver. It costs efficiency today, but it is an
      investment in tomorrow's seniors.
  link_label: { nb: Les kronikken i Finansavisen, en: Read the op-ed (in Norwegian) }
  link: https://www.finansavisen.no/karriere/2026/10/11/8386780/vil-jakten-pa-ai-effektivitet-tomme-selskapene-for-dommekraft

# The things to watch out for. Which ones appear is decided in assets/js/compass.js (see the rule next to each id).
findings:
  efficiency_over_accountability:
    title: { nb: Effektivitet foran ansvar, en: Efficiency over accountability }
    body:
      nb: Beslutningen krever at et menneske står ansvarlig, men KI har i praksis overtatt. Da svekker dere nettopp legitimiteten som er verdien. La KI flagge avvik og utfordre, mens mennesket vurderer.
      en: The decision needs a person to be accountable, but AI has in practice taken over. That erodes the very legitimacy that is the value. Let AI flag anomalies and challenge, while the person assesses.
  automating_judgment:
    title: { nb: Dere automatiserer skjønn, en: You are automating judgment }
    body:
      nb: Målet er sammensatt, og KI kan bare optimere det som lar seg måle. Bruk KI til å utforske mønstre og alternativer, og la beslutningstakeren bestemme.
      en: The goal is composite, and AI can only optimise what can be measured. Use AI to explore patterns and alternatives, and let the decision maker decide.
  human_bottleneck:
    title: { nb: Mennesket er flaskehalsen, en: People are the bottleneck }
    body:
      nb: Målet er klart, og prediksjonen kan skilles fra skjønnet. Manuell behandling gjør prosessen dyrere og tregere uten å gjøre den bedre. La KI ta standardsakene og mennesker ta unntakene.
      en: The goal is clear and the prediction can be separated from judgment. Manual handling makes the process slower and more expensive without making it better. Let AI take the standard cases and people the exceptions.
  wrong_goal:
    title: { nb: KI kan optimere feil mål, en: AI may optimise the wrong goal }
    body:
      nb: Beslutningen kan automatiseres, men målet er vanskelig å skrive ned. Faren er ikke at prediksjonen er feil, men at den treffer et mål som undergraver verdiløftet. Skriv ned hva systemet skal oppnå og hva det ikke skal ofre.
      en: The decision can be automated, but the goal is hard to write down. The danger is not a wrong prediction, but a prediction that hits a goal which undermines the value proposition. Write down what the system should achieve and what it must not sacrifice.
  define_goals_first:
    title: { nb: Definer målet før dere automatiserer, en: Define the goal before you automate }
    body:
      nb: Beslutningen kan overlates til KI, men bare innenfor mål som ledelsen har formulert. Det strategiske arbeidet kommer før det tekniske.
      en: The decision can be handed to AI, but only within goals management has formulated. The strategic work comes before the technical work.
  rubber_stamp:
    title: { nb: Godkjenningen er en formalitet, en: Approval is a formality }
    body:
      nb: Når den som godkjenner, mangler tid, kompetanse eller informasjon til å overprøve KI, er beslutningen i praksis automatisert. Da står noen ansvarlig for vurderinger de ikke reelt gjør.
      en: When the approver lacks the time, expertise or information to overrule the AI, the decision is automated in practice. Someone is then accountable for assessments they do not really make.
  unstable_position:
    title: { nb: Posisjonen er ustabil, en: The position is unstable }
    body:
      nb: Det eneste som holder mennesket i beslutningen, er at KI ikke er god nok ennå. Det endrer seg raskt. Planlegg for dagen beslutningen kan automatiseres, eller finn verdien mennesket tilfører utover det tekniske.
      en: The only thing keeping a person in the decision is that AI is not good enough yet. That is changing fast. Plan for the day it can be automated, or find the value the person adds beyond the technical.
  narrow_goal:
    title: { nb: Er målet så klart som dere tror?, en: Is the goal as clear as you think? }
    body:
      nb: Systemet kan treffe målet og likevel skade tilliten. Da er målet bredere enn tallet systemet optimerer. Uber priset riktig etter etterspørselen, men kundene opplevde det som utnyttelse.
      en: The system can hit its target and still damage trust. Then the goal is broader than the number the system optimises. Uber priced correctly by demand, but customers saw it as exploitation.
  judgment_not_valued:
    title: { nb: Betaler kundene for vurderingen deres?, en: Do customers pay for your judgment? }
    body:
      nb: Dere sier kundene verdsetter at noen står inne for beslutningen, men også at de bare bryr seg om resultatet. Begge kan ikke stemme. Bryr de seg bare om resultatet, kan en aktør som automatiserer alt, utkonkurrere dere.
      en: You say customers value someone standing behind the decision, but also that they only care about the result. Both cannot be true. If they only care about the result, a competitor that automates everything can beat you.
  efficiency_trap:
    title: { nb: Jakten på effektivitet kan fjerne verdien, en: Chasing efficiency can remove the value }
    body:
      nb: Dere sier kundene vil ha det raskt og billig, men også at resultatet mister verdi uten en ansvarlig person. Pass på at effektiviseringen ikke fjerner det kundene faktisk betaler for.
      en: You say customers want it fast and cheap, but also that the result loses value without an accountable person. Make sure efficiency does not remove what customers actually pay for.
  check_gdpr:
    title: { nb: Sjekk GDPR artikkel 22, en: Check GDPR Article 22 }
    body:
      nb: Personer har rett til ikke å bli underlagt avgjørelser som bare bygger på automatisert behandling, når avgjørelsen har rettslig virkning for dem eller påvirker dem vesentlig. Avklar dette før KI får bestemme alene.
      en: People have the right not to be subject to decisions based solely on automated processing when the decision has legal or similarly significant effects on them. Clarify this before AI decides on its own.
  clarify_law:
    title: { nb: Avklar regelverket, en: Clarify the rules }
    body:
      nb: Dere er usikre på om regler krever et menneske i beslutningen. Det avgjør hvor beslutningen hører hjemme, så det må avklares før KI får større rolle.
      en: You are unsure whether rules require a person in the decision. That determines where the decision belongs, so it must be clarified before AI gets a larger role.
  habit:
    title: { nb: Vane er ingen begrunnelse, en: Habit is not a reason }
    body:
      nb: Mennesket er med fordi det alltid har vært slik. Spør hva mennesket faktisk tilfører, og om kundene ville merket forskjellen.
      en: The person is involved because it has always been that way. Ask what the person actually adds, and whether customers would notice the difference.
  ai_underrated:
    title: { nb: Er KI virkelig for dårlig?, en: Is AI really not good enough? }
    body:
      nb: Dere sier KI ikke er god nok, men svarene tyder på at grunnlaget finnes i data og at feil kan rettes. Test det ved å la KI og mennesker ta de samme sakene, og sammenlign.
      en: You say AI is not good enough, but your answers suggest the information is in the data and mistakes can be fixed. Test it by letting AI and people handle the same cases, and compare.
  accountability_claim:
    title: { nb: Hvem krever at noen står ansvarlig?, en: Who requires someone to be accountable? }
    body:
      nb: Dere holder et menneske i beslutningen for å ha noen som står ansvarlig, men sier også at de som berøres bare bryr seg om resultatet. Finn ut hvem som faktisk krever ansvaret.
      en: You keep a person in the decision so someone is accountable, but also say the people affected only care about the result. Find out who actually requires the accountability.
  core_automation:
    title: { nb: Automatisering i kjernen, en: Automation at the core }
    body:
      nb: Kvadranten krever data, skala og lave kostnader, men dere konkurrerer på vurderinger og tillit. Automatiser gjerne, men sørg for at kundene fortsatt ser vurderingene dere konkurrerer på.
      en: The quadrant calls for data, scale and low cost, but you compete on judgment and trust. Automate if you like, but make sure customers still see the judgment you compete on.
  judgment_cost:
    title: { nb: Skjønn som kostnad, en: Judgment as a cost }
    body:
      nb: Beslutningen krever menneskelig skjønn, men dere konkurrerer på kostnad. Enten må skjønnet forsvares som en del av verdien, eller så må beslutningen utformes på nytt.
      en: The decision needs human judgment, but you compete on cost. Either defend the judgment as part of the value, or redesign the decision.

# ---------------------------------------------------------------------------
# The full report on the result page. Five sections:
# main assessment, what to do, what to be careful about, stability, risk of misdiagnosis.
# Placeholders in {braces} are filled in by assets/js/compass.js.
# Based on Berge & Knudsen (2026), Magma 29(4).
report:
  sections:
    main: { nb: Hovedvurdering, en: Main assessment }
    do: { nb: Hva dere bør gjøre, en: What you should do }
    careful: { nb: Hva dere bør være varsomme med, en: What to be careful about }
    stability: { nb: Hvor stabil er posisjonen?, en: How stable is the position? }
    misdiagnosis: { nb: Risiko for feildiagnose, en: Risk of misdiagnosis }
  given: { nb: Gitt at diagnosen er riktig., en: Assuming the diagnosis is right. }
  careful_intro:
    nb: Gitt at diagnosen er riktig. Punkter med grå markering er utløst av svarene deres.
    en: Assuming the diagnosis is right. Points marked in grey are triggered by your answers.
  high_word: { nb: høy, en: high }
  low_word: { nb: lav, en: low }
  and: { nb: og, en: and }
  answered: { nb: "{a} på spørsmålet om {q}", en: "{a} to the question of {q}" }

  # Short names for the questions, used when the report quotes an answer.
  short:
    outcome: { nb: hvor lett det er å si hva et godt utfall er, en: how easy it is to say what a good outcome is }
    number: { nb: utfallet kan måles med ett tall, en: whether the outcome can be measured with one number }
    perfect: { nb: beslutningen kan skade tilliten selv når systemet treffer målet, en: whether the decision can damage trust even when the system hits its target }
    data: { nb: hvor mye av grunnlaget som finnes i data, en: how much of the basis is in data }
    error: { nb: hva som skjer når en feil slipper gjennom, en: what happens when a mistake slips through }
    accountable: { nb: resultatet mister verdi uten en ansvarlig person, en: whether the result loses value without an accountable person }
    people: { nb: beslutningen har vesentlige konsekvenser for enkeltpersoner, en: whether the decision has significant effects on individuals }
    law: { nb: regler krever et menneske, en: whether rules require a person }
    value: { nb: hva kundene verdsetter, en: what customers value }
    compete: { nb: hva dere konkurrerer på, en: what you compete on }
    core: { nb: beslutningen er en del av kjernen, en: whether the decision is part of the core }
    now: { nb: hvilken rolle KI har, en: what role AI plays }
    override: { nb: den som godkjenner kan overprøve KI, en: whether the approver can overrule the AI }
    why: { nb: hvorfor et menneske er med, en: why a person is involved }
    goals: { nb: målene er skrevet ned, en: whether the goals are written down }

  main:
    because:
      nb: Vi plasserer beslutningen i kvadrant {num}, {name}, fordi målklarheten er {g} og separabiliteten er {s}.
      en: We place the decision in quadrant {num}, {name}, because goal clarity is {g} and separability is {s}.
    goal_high:
      nb: Målet kan formuleres som en regel som holder på tvers av situasjoner.
      en: The goal can be written as a rule that holds across situations.
    goal_low:
      nb: Målet er sammensatt eller vanskelig å skrive ned som en fast regel, og det krever skjønn å vekte hensynene mot hverandre.
      en: The goal is composite or hard to write down as a fixed rule, and weighing the considerations takes judgment.
    sep_high:
      nb: Prediksjonen kan brukes uten menneskelig skjønn. Verken teknikk, legitimitet eller regelverk krever at et menneske er med.
      en: The prediction can be used without human judgment. Neither technology, legitimacy nor regulation requires a person to be involved.
    sep_low:
      nb: Menneskelig skjønn må være med i beslutningen, og det skyldes {sources}.
      en: Human judgment has to be part of the decision, because of {sources}.
    source_tech: { nb: tekniske begrensninger, en: technical limitations }
    source_legit: { nb: krav om at noen står ansvarlig, en: the requirement that someone is accountable }
    source_law: { nb: regelverk, en: regulation }
    basis: { nb: "Det bygger på at dere svarte {answers}.", en: "This rests on your answering {answers}." }
    diagnostic: { nb: "Kontrollspørsmålet fra artikkelen er: {q}", en: "The paper's check question is: {q}" }

  quadrants:
    I:
      diagnostic:
        nb: Ville et godt utfall miste legitimitet hvis ingen person sto ansvarlig for vurderingen?
        en: Would a good outcome lose legitimacy if no person were accountable for the assessment?
      example:
        nb: >-
          Revisjon er et typisk eksempel. Oppgaven kan formuleres som et prediksjonsproblem (er det vesentlige feil i regnskapet?),
          men revisjonen er uløselig knyttet til menneskelig attestasjon, kontekstforståelse og faglig ansvar.
        en: >-
          Auditing is a typical example. The task can be framed as a prediction problem (are there material errors in the accounts?),
          but the audit is inseparable from human attestation, contextual understanding and professional responsibility.
      do:
        - { nb: "La KI flagge avvik, foreslå risikoområder og utfordre antakelser.", en: "Let AI flag anomalies, suggest risk areas and challenge assumptions." }
        - { nb: "La et menneske gjøre vurderingen og stå ansvarlig for den, og gjør ansvaret synlig for dem som berøres.", en: "Let a person make the assessment and be accountable for it, and make that accountability visible to those affected." }
        - { nb: "Bygg og forsvar menneskelig dømmekraft som en kilde til verdi. Det er den kvadranten konkurrerer på.", en: "Build and defend human judgment as a source of value. That is what this quadrant competes on." }
        - { nb: "Mål om KI gjør vurderingene bedre, ikke bare raskere.", en: "Measure whether AI makes the assessments better, not just faster." }
      careful:
        - title: { nb: Effektivitet foran ansvar, en: Efficiency over accountability }
          body: { nb: "Å jage effektivitet på bekostning av ansvar svekker legitimiteten som er selve verdiløftet.", en: "Chasing efficiency at the expense of accountability erodes the legitimacy that is the value proposition itself." }
          same_as: efficiency_over_accountability
        - title: { nb: Skjønn som påvirkes av KI, en: Judgment shaped by AI }
          body: { nb: "Menneskelig skjønn påvirkes av KI-forslag, ofte uten at vi merker det selv. Over tid kan vurderingen bli KI-ens, mens ansvaret fortsatt er menneskets.", en: "Human judgment is shaped by AI suggestions, often without our noticing. Over time the assessment can become the AI's, while the accountability stays with the person." }
          same_as: rubber_stamp
    II:
      diagnostic:
        nb: Ville menneskelig involvering først og fremst gjøre prosessen dyrere og tregere?
        en: Would human involvement mainly make the process more expensive and slower?
      example:
        nb: >-
          Skatteetatens automatiske kontroll av mva-meldinger er et eksempel. KI oppdager avvik og fatter standardvedtak,
          mens mennesker trer inn ved unntak og klager.
        en: >-
          The Norwegian Tax Administration's automatic checking of VAT returns is an example. AI detects anomalies and issues
          standard decisions, while people step in for exceptions and appeals.
      do:
        - { nb: "La KI ta standardbeslutningene, og la mennesker håndtere unntak og klager.", en: "Let AI take the standard decisions, and let people handle exceptions and appeals." }
        - { nb: "Bygg prosessene rundt KI-prediksjonene i stedet for å legge KI oppå den gamle prosessen.", en: "Rebuild the processes around the AI predictions instead of adding AI on top of the old process." }
        - { nb: "Bygg konkurransekraft i datatilgang, kostnadseffektivitet og automatisering. Det er det kvadranten krever.", en: "Build strength in data access, cost efficiency and automation. That is what this quadrant demands." }
        - { nb: "Overvåk treffsikkerheten løpende, og sørg for en enkel vei for klager.", en: "Monitor accuracy continuously, and keep a simple route for appeals." }
      careful:
        - title: { nb: Mennesket som flaskehals, en: People as the bottleneck }
          body: { nb: "Å holde fast ved manuelle beslutninger av vane gjør mennesket til flaskehalsen, og dere taper konkurransekraft til dem som har bygget om prosessene.", en: "Holding on to manual decisions out of habit makes people the bottleneck, and you lose ground to those who have rebuilt their processes." }
          same_as: human_bottleneck
        - title: { nb: Feil i stor skala, en: Mistakes at scale }
          body: { nb: "Når ingen ser over, skaleres feil og skjevheter. Kjente eksempler er advokater som siterte oppdiktede rettsavgjørelser, og KI som silte jobbsøkere etter kjønn.", en: "When no one checks, mistakes and biases scale. Known examples are lawyers citing fictitious cases, and AI screening job applicants by gender." }
    III:
      diagnostic:
        nb: Er målet så sammensatt at en presis KI-prediksjon ville forenklet for mye?
        en: Is the goal so composite that a precise AI prediction would oversimplify?
      example:
        nb: >-
          Aftenposten er et eksempel. KI kan predikere hva som gir klikk og engasjement, men det kreves redaksjonelt skjønn
          for å nå de mer diffuse målene om troverdighet og legitimitet.
        en: >-
          A newspaper like Aftenposten is an example. AI can predict what drives clicks and engagement, but editorial judgment is
          needed to reach the more diffuse goals of credibility and legitimacy.
      do:
        - { nb: "Bruk KI utforskende: til innsikt, mønstre og alternative perspektiver.", en: "Use AI to explore: for insight, patterns and alternative perspectives." }
        - { nb: "La beslutningstakeren gjøre vurderingene og ta beslutningen.", en: "Let the decision maker make the assessments and take the decision." }
        - { nb: "Vær tydelig på hvilke hensyn KI ikke kan måle, som troverdighet og legitimitet, og gi dem vekt i beslutningen.", en: "Be explicit about the considerations AI cannot measure, such as credibility and legitimacy, and give them weight in the decision." }
      careful:
        - title: { nb: Automatisert skjønn, en: Automated judgment }
          body: { nb: "KI kan predikere det målbare, som klikk og engasjement, men ikke de diffuse målene. Automatiseres skjønnet, risikerer beslutningstakeren å miste troverdighet og undergrave verdiløftet.", en: "AI can predict what is measurable, like clicks and engagement, but not the diffuse goals. If judgment is automated, the decision maker risks losing credibility and undermining the value proposition." }
          same_as: automating_judgment
        - title: { nb: Når tallene får styre, en: When the numbers take over }
          body: { nb: "Selv som rådgiver kan KI trekke beslutningene mot det som lar seg måle. Gjør det tydelig hvilke hensyn tallene ikke fanger.", en: "Even as an adviser, AI can pull decisions towards what can be measured. Make clear which considerations the numbers miss." }
    IV:
      diagnostic:
        nb: Kan beslutningen få strategiske eller etiske konsekvenser selv om den teknisk kan automatiseres?
        en: Could the decision have strategic or ethical consequences even though it can technically be automated?
      example:
        nb: >-
          Bulder Bank er et eksempel. Banken brukte en prediksjon av kundenes boligverdi til å automatisere et løfte om lavere
          rente når boligverdien steg, i stedet for å bruke den til å optimere marginene. Det smale målet var strategisk valgt
          og underbygget verdiløftet.
        en: >-
          Bulder Bank is an example. The bank used a prediction of customers' property values to automate a promise of a lower
          rate when the value rose, instead of using it to optimise margins. The narrow goal was chosen strategically and
          supported the value proposition.
      do:
        - { nb: "Definer og skriv ned målene KI skal handle innenfor, før den får handle selv.", en: "Define and write down the goals AI is to act within, before it acts on its own." }
        - { nb: "Velg et smalt mål som underbygger verdiløftet, slik Bulder Bank automatiserte et løfte i stedet for å optimere marginene.", en: "Choose a narrow goal that supports the value proposition, as Bulder Bank automated a promise instead of optimising margins." }
        - { nb: "Gå gjennom målene jevnlig. Strategien er kartet KI navigerer etter.", en: "Review the goals regularly. The strategy is the map the AI navigates by." }
      careful:
        - title: { nb: Feil mål, en: The wrong goal }
          body: { nb: "Faren er ikke at prediksjonen er feil, men at den optimerer et mål som undergraver verdiløftet. Uber priset riktig etter etterspørselen, men kundene opplevde det som utnyttelse.", en: "The danger is not a wrong prediction, but a prediction that optimises a goal which undermines the value proposition. Uber priced correctly by demand, but customers saw it as exploitation." }
          same_as: wrong_goal
        - title: { nb: Strategiske og etiske konsekvenser, en: Strategic and ethical consequences }
          body: { nb: "En beslutning kan få strategiske eller etiske konsekvenser selv om den teknisk kan automatiseres. Noen må eie målene og stå ansvarlig for dem.", en: "A decision can have strategic or ethical consequences even though it can technically be automated. Someone has to own the goals and be accountable for them." }

  # How AI is used today, as part of a sentence.
  now_phrase:
    none: { nb: brukes ikke KI i beslutningen, en: AI is not used in the decision }
    advise: { nb: "gir KI innsikt og forslag, mens et menneske bestemmer", en: "AI gives insight and suggestions, while a person decides" }
    approve: { nb: "bestemmer KI, mens et menneske godkjenner", en: "AI decides, while a person approves" }
    alone: { nb: bestemmer KI alene, en: AI decides on its own }
    rubber: { nb: "bestemmer KI, og godkjenningen er i praksis et stempel", en: "AI decides, and approval is a rubber stamp in practice" }
  gap:
    too_much:
      nb: I dag, eller i planene deres, {now}. Gitt diagnosen har KI en for stor rolle. Flytt KI over i en støtterolle, der et menneske vurderer og står ansvarlig.
      en: Today, or in your plans, {now}. Given the diagnosis, AI has too large a role. Move AI into a supporting role, where a person assesses and is accountable.
    too_little:
      nb: I dag, eller i planene deres, {now}. Gitt diagnosen er det her gevinsten ligger, og KI kan få en større rolle.
      en: Today, or in your plans, {now}. Given the diagnosis, this is where the gains are, and AI can take a larger role.
    too_little_iv:
      nb: I dag, eller i planene deres, {now}. Gitt diagnosen kan KI få en større rolle, men først når ledelsen har skrevet ned målene den skal handle innenfor.
      en: Today, or in your plans, {now}. Given the diagnosis, AI can take a larger role, but only once management has written down the goals it is to act within.
    match:
      nb: I dag, eller i planene deres, {now}. Det stemmer med diagnosen.
      en: Today, or in your plans, {now}. That matches the diagnosis.
    write_goals:
      nb: Skriv ned hva KI skal optimere mot, og hva den ikke skal ofre. I dag er målene {goals}.
      en: Write down what the AI should optimise for, and what it must not sacrifice. Today the goals are {goals}.
    goals_implicit: { nb: delvis eller underforstått formulert, en: partly or implicitly stated }
    goals_none: { nb: ikke skrevet ned, en: not written down }
    support:
      nb: Beslutningen er en støtteprosess, ikke det kundene velger dere for. Da er det lite som taler mot å automatisere den.
      en: The decision is a support process, not what customers choose you for. There is little reason not to automate it.
    defend:
      nb: Beslutningen er en del av kjernen, og dere konkurrerer på vurderinger og tillit. Skjønnet her er en del av det kundene betaler for. Forsvar det, og gjør det synlig.
      en: The decision is part of the core, and you compete on judgment and trust. The judgment here is part of what customers pay for. Defend it, and make it visible.

  stability:
    high_intro:
      nb: "Separabiliteten er høy i dag, men posisjonen kan flytte seg:"
      en: "Separability is high today, but the position can move:"
    high_law:
      title: { nb: Regelverk, en: Regulation }
      body: { nb: "Nye regler for automatiserte beslutninger kan kreve menneskelig kontroll og flytte beslutningen mot venstre i kompasset.", en: "New rules on automated decisions can require human oversight and move the decision to the left of the compass." }
    high_law_people:
      nb: Siden beslutningen har vesentlige konsekvenser for enkeltpersoner, er dette særlig aktuelt for dere.
      en: Since the decision has significant effects on individuals, this applies to you in particular.
    high_legit:
      title: { nb: Legitimitet, en: Legitimacy }
      body: { nb: "Kundenes forventninger kan endre seg, for eksempel etter en sak der en automatisert beslutning slo feil ut. Da kan kravet om en ansvarlig person komme tilbake.", en: "Customer expectations can change, for example after a case where an automated decision went wrong. The demand for an accountable person can then return." }
    high_tech:
      title: { nb: Teknikk, en: Technology }
      body: { nb: "Dere forutsetter at KI er treffsikker nok til å handle uten tilsyn. Feil og skjevheter skaleres når ingen ser over, særlig når oppgavene henger sammen.", en: "You assume the AI is accurate enough to act without oversight. Mistakes and biases scale when no one checks, especially when tasks depend on each other." }
    low_intro:
      nb: "Posisjonen er ikke mer stabil enn det som holder mennesket i beslutningen. For dere er det:"
      en: "The position is only as stable as what keeps the person in the decision. For you that is:"
    legit:
      title: { nb: Legitimitet, en: Legitimacy }
      body:
        nb: >-
          De som berøres, forventer at et menneske står ansvarlig. Ifølge artikkelen er dette det mest robuste ankeret, fordi det
          bygger på beslutningens natur og opparbeidet troverdighet, som er vanskelig å kopiere. Men det holder bare så lenge
          kundene faktisk verdsetter menneskelig dømmekraft. Avklar to ting: Ville kundene merket og brydd seg om mennesket ble borte?
          Og vil de fortsatt gjøre det om fem år, når konkurrenter som automatiserer alt, tilbyr det samme billigere?
        en: >-
          Those affected expect a person to be accountable. According to the paper this is the most robust anchor, because it rests on
          the nature of the decision and accumulated credibility, which are hard to imitate. But it holds only as long as customers
          actually value human judgment. Clarify two things: Would customers notice and care if the person were gone? And will they
          still care in five years, when competitors that automate everything offer the same for less?
      weak:
        nb: Merk at dere ikke svarte at kundene verdsetter at noen står inne for beslutningen. Da kan dette ankeret være svakere enn det ser ut.
        en: Note that you did not answer that customers value someone standing behind the decision. This anchor may then be weaker than it looks.
    law:
      title: { nb: Regelverk, en: Regulation }
      body:
        nb: >-
          Regler krever at et menneske tar eller godkjenner beslutningen. Posisjonen står så lenge reglene står, men den er påtvunget
          utenfra og sier ingenting om hvor verdien ligger. Regelverk endres, og en endring kan flytte beslutningen til en annen kvadrant.
          Spør: Ville vi hatt et menneske her uten regelkravet? Er svaret nei, bør mennesket i det minste gi reell kontroll og ikke bare
          oppfylle et formkrav.
        en: >-
          Rules require a person to make or approve the decision. The position holds as long as the rules do, but it is imposed from
          outside and says nothing about where the value lies. Rules change, and a change can move the decision to another quadrant.
          Ask: Would we have a person here without the rule? If not, the person should at least provide real oversight, not just meet
          a formal requirement.
      only:
        nb: Uten regelkravet ville beslutningen ligget i kvadrant {num}, {name}.
        en: Without the rule, the decision would sit in quadrant {num}, {name}.
    tech:
      title: { nb: Teknikk, en: Technology }
      body:
        nb: >-
          Mennesket er med fordi KI ikke er god nok ennå. Dette er det minst stabile ankeret. Teknologien utvikler seg raskt, og det er
          stor risiko for at KI etter hvert kan overta hele prosessen. Spør hva som skal til før KI gjør dette like godt som dere,
          og hva dere gjør da.
        en: >-
          The person is involved because AI is not good enough yet. This is the least stable anchor. The technology is developing fast,
          and there is a high risk that AI will eventually be able to take over the whole process. Ask what it would take for AI to do
          this as well as you, and what you will do then.
      only:
        nb: Siden dette er det eneste som holder mennesket i beslutningen, er posisjonen ustabil. Planlegg for dagen beslutningen kan automatiseres, eller finn verdien mennesket tilfører utover det tekniske.
        en: Since this is the only thing keeping the person in the decision, the position is unstable. Plan for the day it can be automated, or find the value the person adds beyond the technical.
    verdict:
      legit: { nb: "Samlet er posisjonen relativt stabil, så lenge kundene fortsetter å verdsette menneskelig dømmekraft.", en: "Overall the position is fairly stable, as long as customers keep valuing human judgment." }
      law: { nb: "Samlet er posisjonen like stabil som regelverket.", en: "Overall the position is as stable as the rules." }
      tech: { nb: "Samlet er posisjonen ustabil.", en: "Overall the position is unstable." }
    goal_changes:
      nb: Dere sier også at det som teller, endrer seg over tid. Da kan målklarheten flytte seg, og diagnosen bør tas opp igjen jevnlig.
      en: You also say that what counts changes over time. Goal clarity can then shift, and the diagnosis should be revisited regularly.
    closing:
      nb: KI-kompasset er ikke statisk. Vurder diagnosen på nytt når teknologi, regelverk eller konkurranse endrer seg.
      en: The AI Compass is not static. Revisit the diagnosis when technology, regulation or competition changes.

  misdiagnosis:
    intro:
      nb: "Feildiagnose kan bli kostbar. Uber behandlet prisingen som en automatisert beslutning med et klart mål, men målet var bredere enn tallet algoritmen optimerte. Disse svarene trekker i en annen retning enn diagnosen:"
      en: "Misdiagnosis can be costly. Uber treated pricing as an automated decision with a clear goal, but the goal was broader than the number the algorithm optimised. These answers point in a different direction from the diagnosis:"
    against_goal_high: { nb: "Dere svarte {answer}. Det trekker mot lavere målklarhet.", en: "You answered {answer}. That points to lower goal clarity." }
    against_goal_low: { nb: "Dere svarte {answer}. Det trekker mot høyere målklarhet.", en: "You answered {answer}. That points to higher goal clarity." }
    against_sep_high: { nb: "Dere svarte {answer}. Det trekker mot lavere separabilitet.", en: "You answered {answer}. That points to lower separability." }
    against_sep_low: { nb: "Dere svarte {answer}. Det trekker mot høyere separabilitet.", en: "You answered {answer}. That points to higher separability." }
    value_auto:
      nb: Dere svarte at kundene verdsetter at noen med kompetanse står inne for beslutningen, men diagnosen sier at den kan tas uten menneskelig skjønn. Ett av dem er feil.
      en: You answered that customers value someone competent standing behind the decision, but the diagnosis says it can be made without human judgment. One of these is wrong.
    value_human:
      nb: Dere svarte at kundene verdsetter at beslutningen er rask og billig, men diagnosen sier at den krever menneskelig skjønn. Undersøk om skjønnet faktisk er noe kundene betaler for.
      en: You answered that customers value the decision being fast and cheap, but the diagnosis says it needs human judgment. Check whether the judgment is something customers actually pay for.
    none:
      nb: Svarene deres peker stort sett i samme retning. Det styrker diagnosen, men utelukker ikke at hele ledergruppen deler den samme blindsonen.
      en: Your answers mostly point the same way. That strengthens the diagnosis, but does not rule out a blind spot shared by the whole leadership team.
