    tagline: Find the right role for AI in one specific decision.
    input_label: Which decision do you want to analyse?
    input_placeholder: E.g. approving supplier invoices
    examples_label: Or try
    examples:
      - Approving supplier invoices
      - Pricing new products
      - First screening of job applicants
      - Choosing the front-page stories
    start: Start
    meta: Three minutes · nothing you type is stored
    too_short: Enter one specific decision, for example "approving supplier invoices".
    too_broad: This sounds like more than one decision. The compass works best on one specific decision at a time.
    edit: Edit
    continue_anyway: Continue anyway
    what_is: What is the AI Compass?
    what_is_body: >-
      Two questions decide the role AI should play in a decision: Can the goal be written as a rule?
